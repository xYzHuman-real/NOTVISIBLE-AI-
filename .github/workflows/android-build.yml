name: NOTVISIBLEAI Android Release
# Rebuild redesigned multi-screen app

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-play-bundle.yml"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Build installable debug APK and release APK
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: NOTVISIBLEAI-installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: NOTVISIBLEAI-release-APK-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
